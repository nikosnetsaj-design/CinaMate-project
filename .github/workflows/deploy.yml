name: Deploy su GitHub Pages

on:
  push:
    # Only the default branch publishes. Pages serves one deployment at a time,
    # so listing a feature branch here would let a work-in-progress push quietly
    # replace the live site; use workflow_dispatch to publish a branch on purpose.
    branches: [Cinemate]
  # Le PR verso Cinemate fanno gli stessi controlli e la stessa build, ma non
  # pubblicano: gli ultimi due passi sono saltati (vedi gli `if` più sotto).
  pull_request:
    branches: [Cinemate]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish. A PR's
# checks are only checks: a newer push to the same PR replaces them.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # I controlli vengono prima della build: se uno fallisce il job si ferma
      # e la pubblicazione non parte. Il sito resta quello di prima invece di
      # diventare una versione che i test sapevano già rotta.
      - run: npm run lint
      - run: npm test
      - run: npm run contrast
      # Il giro completo in un Chromium vero: avvio, aggiunta, una puntata
      # segnata, esportazione. Costruisce l'app per conto suo, alla radice.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - run: npm run build
        env:
          GITHUB_PAGES: "true"
      # Il primo caricamento sotto i 200 KB gzip: sopra, la pubblicazione non parte.
      - run: npm run budget
      # Pages has no server-side routing, so every unknown path must fall back
      # to the app shell or a refresh on /libreria would 404.
      - run: cp dist/index.html dist/404.html
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
